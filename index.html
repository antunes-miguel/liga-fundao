<!DOCTYPE html>
<!--
  Fantasy Fundão: redesign (protótipo funcional).
  Antes de alterar o design, ler docs/HANDOFF.md (decisões de design) e o CLAUDE.md (dados, notificações).
-->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0A0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F2F0" media="(prefers-color-scheme: light)">
<title>Fantasy Fundão</title>
<!-- Instalar como app (manifest.webmanifest e assets/ ao lado deste index.html) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy Fundão">
<meta name="application-name" content="Fantasy Fundão">
<script>
  /* Apply the saved theme before the first paint so there is no flash */
  try { const t = localStorage.getItem('ff-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Tokens ─────────
   Brand palette “Cherry to Forest” (Figma: 03 — Colour System)
   Light = “Wallpaper Variant 4 — Light”, Dark = “05 — Applications”.  */
:root{
  /* Brand constants (same in both themes) */
  --deep:#3D0F1E; --wine:#5C1A2A; --cherry:#8B2D3A; --forest:#1B4332; --dark-forest:#2D3A2D; --white:#FFFFFF;

  /* Light theme */
  --ink:#F5F2F0;                 /* wallpaper light base */
  --surface:#FFFFFF;
  --surface-2:#EDE6E4;           /* wine at 8% over the base, as in the wallpaper shards */
  --line:rgba(61,15,30,.10);
  --text:#3D0F1E;                /* deep cherry */
  --text-2:rgba(61,15,30,.74);
  --text-3:rgba(61,15,30,.58);
  --accent:#8B2D3A;              /* cherry red, labels and tags */
  --win:#1B4332; --loss:#8B2D3A;
  --good:#1B4332; --bad:#8B2D3A; --cell:#EDE6E4; --cell-text:#3D0F1E;
  --s1:#8B2D3A; --s2:#1B4332; --s3:#3D0F1E;
  --shard-a:rgba(92,26,42,.08);  /* exactly the wallpaper motif */
  --shard-b:rgba(27,67,50,.08);
  /* Liquid glass material */
  --glass-tint:rgba(255,255,255,.46);
  --glass-rim:rgba(255,255,255,.95);
  --glass-rim-low:rgba(255,255,255,.35);
  --glass-sheen:rgba(255,255,255,.55);
  --glass-shadow:0 12px 32px rgba(61,15,30,.16),0 2px 6px rgba(61,15,30,.08),0 0 0 .5px rgba(61,15,30,.10);
  --lens:rgba(61,15,30,.07);
  --lens-hi:rgba(255,255,255,.9);
  --nav-on:#8B2D3A;
  --thumb:#FFFFFF;
  --focus:#8B2D3A;

  --display:"Premier League","Lexend",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:16px; --r-md:12px; --r-sm:10px;   /* brand cards use 16px */
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Dark theme: written twice, once for the system setting and once for the manual choice */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0F0A0F; --surface:#1F1A1F; --surface-2:#2B242A; --line:rgba(255,255,255,.08);
    --text:#FFFFFF; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.52);
    --accent:#E07A8B; --win:#80CC80; --loss:#E07A8B;
    --good:#1B4332; --bad:#8B2D3A; --cell:#2B242A; --cell-text:#FFFFFF;
    --s1:#FFFFFF; --s2:#80CC80; --s3:#E07A8B;
    --shard-a:rgba(92,26,42,.30); --shard-b:rgba(27,67,50,.30);
    --glass-tint:rgba(44,34,41,.38); --glass-rim:rgba(255,255,255,.42); --glass-rim-low:rgba(255,255,255,.08); --glass-sheen:rgba(255,255,255,.14);
    --glass-shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    --lens:rgba(255,255,255,.13); --lens-hi:rgba(255,255,255,.28); --nav-on:#FFFFFF; --thumb:#3A3239;
    --focus:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#0F0A0F; --surface:#1F1A1F; --surface-2:#2B242A; --line:rgba(255,255,255,.08);
  --text:#FFFFFF; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.52);
  --accent:#E07A8B; --win:#80CC80; --loss:#E07A8B;
  --good:#1B4332; --bad:#8B2D3A; --cell:#2B242A; --cell-text:#FFFFFF;
  --s1:#FFFFFF; --s2:#80CC80; --s3:#E07A8B;
  --shard-a:rgba(92,26,42,.30); --shard-b:rgba(27,67,50,.30);
  --glass-tint:rgba(44,34,41,.38); --glass-rim:rgba(255,255,255,.42); --glass-rim-low:rgba(255,255,255,.08); --glass-sheen:rgba(255,255,255,.14);
    --glass-shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    --lens:rgba(255,255,255,.13); --lens-hi:rgba(255,255,255,.28); --nav-on:#FFFFFF; --thumb:#3A3239;
  --focus:#FFFFFF;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--ink); color:var(--text);
  font:400 15px/1.45 var(--body);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.motif{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.motif .a{fill:var(--shard-a)} .motif .b{fill:var(--shard-b)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── Header ───────── */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb,var(--ink) 86%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand svg{width:34px;height:auto;flex:none}
.brand-name{font:700 14px/.92 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.top-nav{display:none;margin-left:12px;padding:4px;border-radius:999px;gap:2px}
.top-nav button{position:relative;z-index:1;padding:8px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--text-2)}
.top-nav button[aria-current="page"]{color:var(--nav-on)}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px}
/* Theme: on phones one button opens the three options as a vertical menu; on desktop they sit inline */
.theme-wrap{position:relative}
.theme-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--text);background:var(--surface-2);transition:background-color .25s,box-shadow .25s}
.theme-btn svg{width:18px;height:18px}
.theme{position:absolute;right:0;top:calc(100% + 8px);z-index:30;display:flex;flex-direction:column;gap:2px;padding:6px;min-width:184px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.22);
  transform-origin:top right;opacity:0;scale:.92;translate:0 -4px;pointer-events:none;visibility:hidden;
  transition:opacity .18s,scale .22s cubic-bezier(.3,1.3,.5,1),translate .22s,visibility 0s .22s}
.theme-wrap.open .theme{opacity:1;scale:1;translate:0 0;pointer-events:auto;visibility:visible;transition:opacity .18s,scale .22s cubic-bezier(.3,1.3,.5,1),translate .22s}
.theme button{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:600;color:var(--text-2);text-align:left}
.theme button svg{width:18px;height:18px;flex:none}
.theme button[aria-checked="true"]{background:color-mix(in srgb,var(--text) 7%,var(--surface));color:var(--text)}
@media (hover:hover){.theme button:hover:not([aria-checked="true"]){color:var(--text)}}
@media (min-width:760px){
  .theme-btn{display:none}
  .theme{position:static;flex-direction:row;min-width:0;padding:3px;border:0;border-radius:999px;background:var(--surface-2);box-shadow:none;
    opacity:1;scale:1;translate:0 0;pointer-events:auto;visibility:visible;transition:none}
  .theme button{width:30px;height:30px;padding:0;justify-content:center;border-radius:999px}
  .theme button svg{width:16px;height:16px}
  .theme button .tl{display:none}
  .theme button[aria-checked="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
}

/* Scrolled header on phones: the bar dissolves, only the crest and the theme button stay, as floating glass */
.edge-top{display:none}
@media (max-width:759px){
  .top{transition:background-color .3s,border-color .3s,backdrop-filter .3s}
  .brand{border-radius:999px;transition:gap .3s,width .3s,height .3s,background-color .3s,box-shadow .3s}
  .brand svg{transition:width .3s}
  .brand-name{display:block;max-width:110px;overflow:hidden;white-space:nowrap;transition:opacity .2s,max-width .3s}
  .top.scrolled{background:transparent;border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  .top.scrolled .brand{gap:0;width:44px;height:44px;justify-content:center}
  .top.scrolled .brand svg{width:24px}
  .top.scrolled .brand-name{opacity:0;max-width:0}
  .top.scrolled :is(.brand,.theme-btn){position:relative;isolation:isolate;background:var(--glass-tint);
    -webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.04);backdrop-filter:blur(14px) saturate(190%) brightness(1.04);box-shadow:var(--glass-shadow)}
  .top.scrolled .theme-btn{width:44px;height:44px}
  .top.scrolled :is(.brand,.theme-btn)::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(155deg,var(--glass-rim) 0%,var(--glass-rim-low) 32%,transparent 55%,var(--glass-rim-low) 78%,var(--glass-rim) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  /* soft fade at the top so content scrolling under the floating buttons stays calm */
  .edge-top{display:block;position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 84px);z-index:19;pointer-events:none;
    background:linear-gradient(to bottom,color-mix(in srgb,var(--ink) 82%,transparent),transparent);opacity:0;transition:opacity .3s}
  body.scrolled .edge-top{opacity:1}
}
@media (min-width:760px){
  .top-nav{display:flex}
}

/* ───────── Shell ───────── */
.app{max-width:1120px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.app{padding:28px 24px 64px}}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 16px}
@media (min-width:760px){.panel{padding:22px 24px}}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.h2{margin:0;font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:-.005em}
.hint{margin:4px 0 0;color:var(--text-2);font-size:14px;max-width:62ch}
.foot{margin:16px 0 0;color:var(--text-3);font-size:13px;max-width:70ch}

/* ───────── Matchday card (the one loud thing) ───────── */
.jornada{display:grid;gap:16px}
@media (min-width:900px){
  .jornada{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
  /* the card and the tables share the first row and the same height; the card stretches */
  .jornada>.matchday,.jornada>.tables{grid-row:1;align-self:stretch}
}
.matchday{
  position:relative;overflow:hidden;border-radius:var(--r-lg);color:#fff;
  background:linear-gradient(110deg,var(--deep) 0 60%,var(--wine) 60% 79%,var(--cherry) 79% 87%,var(--deep) 87%);
  padding:18px 20px 20px;display:flex;flex-direction:column;gap:22px;min-height:400px;
}
.md-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.22);border-radius:999px;padding:4px}
.stepper button{width:32px;height:32px;border-radius:999px;display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:rgba(255,255,255,.12)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper svg{width:16px;height:16px}
.stepper output{min-width:76px;text-align:center;font-weight:600;font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:rgba(0,0,0,.22)}
.icon-btn:hover{background:rgba(0,0,0,.34)}
.icon-btn svg{width:18px;height:18px}
.eyebrow{margin:0;font:700 11px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.md-title{margin:0;font:700 clamp(54px,14vw,84px)/.88 var(--display);text-transform:uppercase;letter-spacing:-.025em}
.md-title span{display:block}
.md-winner{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:24px;row-gap:6px;align-items:center}
.md-face{width:76px;height:76px;border-radius:999px;object-fit:cover;box-shadow:0 0 0 3px #fff,0 8px 24px rgba(0,0,0,.35)}
.md-who{min-width:0;display:grid;gap:4px}
.md-name{margin:0;font:600 22px/1.15 var(--body)}
.md-score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.md-pts{font:700 44px/1 var(--display)}
.md-pts small{font:600 15px var(--body);margin-left:4px;opacity:.7}
.md-foot{margin-top:auto;display:grid;grid-template-columns:1fr auto 76px;align-items:start;column-gap:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.md-stat p{margin:0}
.md-stat .v{margin-top:6px;font:700 22px/1.1 var(--display)}
.md-stat .s{margin-top:2px;font-size:13px;color:rgba(255,255,255,.72)}
@media (min-width:900px){.matchday{min-height:520px}}


/* Stickers: brand badges stuck onto faces, slightly rotated like the real thing */
.face-wrap{position:relative;display:inline-block;flex:none}
.stk{position:absolute;display:block;pointer-events:none}
.stk:empty{display:none}
.stk svg{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.face-wrap .stk-win{width:54px;height:54px;right:-18px;bottom:-12px;transform:rotate(-12deg)}
.pc-id .face-wrap .stk{width:54px;height:54px;right:-12px;bottom:-8px}
.pc-id .face-wrap .stk.stk-last{transform:rotate(10deg)}
/* brand "Secondary icon" (tree, crown and river, no shield): a small signature in the card's bottom-left corner */
.md-mark{position:absolute;left:20px;bottom:16px;height:24px;width:auto;fill:#fff;opacity:.7;pointer-events:none}
/* last place: the winner's layout mirrored, sticker big and the face small on top */
.md-last-txt{text-align:right}
.md-last-txt .eyebrow{margin-right:-.28em}   /* tracking adds space after the last letter; pull it back so the right edges line up */
.last-part[hidden]{display:none}
.last-wrap{position:relative;width:76px;height:76px;align-self:center}
.stk-big{display:block;width:76px;height:76px;transform:rotate(-8deg)}
.stk-big svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
.md-last-face{position:absolute;left:-16px;bottom:-10px;width:40px;height:40px;border-radius:999px;object-fit:cover;box-shadow:0 0 0 2.5px #fff,0 4px 10px rgba(0,0,0,.3)}


/* Payments */
.debt.due{color:var(--loss)}
.debt small{display:block;margin-top:3px;font-size:11px;font-weight:600;text-align:right}
.tag.due{background:color-mix(in oklab,var(--cherry) 18%,var(--surface));color:var(--loss)}
.due-txt{color:var(--loss);font-weight:600}


/* Share sheet */
.sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(15,10,15,.55);opacity:0;transition:opacity .2s}
.sheet-card{position:relative;width:min(100%,440px);margin:0 8px calc(8px + env(safe-area-inset-bottom,0px));padding:14px;border-radius:28px;
  background:var(--surface);box-shadow:0 20px 60px rgba(0,0,0,.4);transform:translateY(24px);opacity:0;transition:transform .25s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-card{transform:none;opacity:1}
@media (min-width:760px){.sheet{align-items:center}.sheet-card{margin:0}}
.sheet-card img{display:block;width:100%;aspect-ratio:4/5;height:auto;max-height:62vh;object-fit:contain;border-radius:16px;background:var(--deep)}
.sheet-card[aria-busy="true"] img{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.btn:disabled{opacity:.5}
.sheet-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:12px}
.btn{height:48px;border-radius:999px;font-weight:700;font-size:15px;background:color-mix(in srgb,var(--text) 7%,var(--surface));color:var(--text)}
.btn.primary{background:var(--cherry);color:#fff}


/* Share buttons on tables */
.share-btn{flex:none;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--text);
  background:color-mix(in srgb,var(--text) 7%,var(--surface));transition:background-color .15s}
.share-btn svg{width:18px;height:18px}
@media (hover:hover){.share-btn:hover{background:color-mix(in srgb,var(--text) 12%,var(--surface))}}
.share-btn:active{transform:scale(.94)}
.tables-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tables-bar .segctl{flex:1;margin-bottom:0}
.seg-bar{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.seg-bar .seg{flex:1;min-width:0;margin:0 0 0 -16px;padding:0 0 0 16px}
.seg-bar .share-btn{background:var(--surface);border:1px solid var(--line)}
@media (min-width:760px){.seg-bar .seg{margin:0;padding:0}}

/* Debt panel on the profile */
.debt-sum{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:14px}
.debt-sum .v{font:700 32px/1 var(--display)}
.debt-sum .s{font-size:14px;color:var(--text-2)}
.debt-sum .due-txt{font-size:14px}
.debt-state{flex-basis:100%;font-size:14px;font-weight:600;color:var(--text-2)}
.debt-weeks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.debt-weeks li{position:relative;border-radius:var(--r-sm);padding:8px 6px;text-align:center;background:color-mix(in srgb,var(--text) 5%,var(--surface))}
.debt-weeks .tick{width:14px;height:14px;border-radius:999px;display:grid;place-items:center;background:var(--forest);color:#fff}
.debt-weeks .tick svg{width:9px;height:9px}
.debt-weeks .left{display:block;margin-top:2px;font-size:11px;font-weight:600;color:var(--loss);white-space:nowrap}
.caption{margin:16px 0 0;font-size:13px;line-height:1.45;color:var(--text-3);max-width:60ch}
.pays-h{margin:18px 0 6px;font-size:13px;font-weight:700;color:var(--text-2)}
.pays{list-style:none;margin:0;padding:0}
.pays li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.pays .d{font-weight:600}
.pays .r{color:var(--text-3);font-size:14px}
.pays .v{font-weight:700}
.debt-weeks .g{display:flex;align-items:center;justify-content:center;gap:4px;height:16px;font-size:12px;font-weight:600;color:var(--text-3)}
.debt-weeks .a{display:block;margin-top:2px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.debt-weeks li.won .a{color:var(--win);font-size:13px}
.debt-weeks li.due .a{color:var(--loss)}
.debt-weeks li.due{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--loss) 60%,transparent)}


/* Notifications: two states, under the tables */
.notif[hidden]{display:none}
.notif:disabled{opacity:.6;cursor:default}
.notif{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:999px;
  font-size:15px;font-weight:700;background:var(--cherry);color:#fff;transition:background-color .2s,color .2s,transform .12s}
.notif:active{transform:scale(.98)}
@media (hover:hover){.notif:not([aria-pressed="true"]):hover{background:#9A3445}}
.notif-ic{position:relative;display:grid;place-items:center}
.notif-ic>svg{width:20px;height:20px}
.notif-ok{position:absolute;right:-6px;bottom:-4px;width:14px;height:14px;border-radius:999px;display:none;place-items:center;
  background:var(--forest);color:#fff;box-shadow:0 0 0 2px var(--notif-bg,var(--surface))}
.notif-ok svg{width:9px;height:9px}
.notif[aria-pressed="true"]{--notif-bg:color-mix(in oklab,var(--forest) 14%,var(--surface));background:var(--notif-bg);color:var(--win);
  box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--forest) 40%,transparent)}
.notif[aria-pressed="true"] .notif-ok{display:grid}
@media (min-width:900px){.notif{grid-column:2}}
.home-foot{text-align:center;font-size:13px;color:var(--text-3);padding:4px 0 8px}
.home-foot p{margin:4px 0}
.home-foot strong{color:var(--text-2)}
@media (min-width:900px){.home-foot{grid-column:2}}

/* ───────── Rows ───────── */
.rows{list-style:none;margin:0;padding:0}
.rows>li{position:relative;border-bottom:1px solid var(--line)}
.rows>li:last-child{border-bottom:0}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 16px;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.av{display:block;width:40px;height:40px;border-radius:999px;object-fit:cover;background:var(--surface-2)}
/* Avatar with the position on a small badge, coloured as in the brand Standings card */
.avr{position:relative;width:40px;height:40px;flex:none}
.avr .pos{position:absolute;left:-5px;bottom:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:999px;display:grid;place-items:center;
  font:700 11px/1 var(--body);background:var(--surface-2);color:var(--text-2);box-shadow:0 0 0 2px var(--row-bg,var(--surface));transition:box-shadow .15s}
.avr .pos.p1{background:var(--forest);color:#fff}
.avr .pos.p2,.avr .pos.p3{background:var(--wine);color:#fff}
.av-sm{width:22px;height:22px;border-radius:999px;object-fit:cover;flex:none}
.who-cell{display:flex;align-items:center;gap:8px}
.who{min-width:0}
.who .n{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.who .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who .move{flex:none}
.nm-l{display:none}
@media (min-width:480px){.nm-l{display:inline}.nm-s{display:none}}
.who .sub{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;font-size:13px;color:var(--text-3)}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--text-2)}
.tag.chip{background:color-mix(in oklab,var(--cherry) 22%,var(--surface));color:var(--accent)}
.move{font-size:12px;font-weight:700}
.move.up{color:var(--win)} .move.down{color:var(--loss)} .move.same{color:var(--text-3)}
.pts{font:700 17px/1 var(--body);text-align:right;min-width:36px;color:var(--win)}
.pts small{display:block;margin-top:3px;font-size:12px;font-weight:500;color:var(--text-3)}
.debt{font:700 15px/1 var(--body);text-align:right;min-width:72px}
.debt.zero{color:var(--win);font-size:13px;font-weight:600}

/* ───────── Liga ───────── */
.liga-sum{margin:0 0 16px;font-size:15px;color:var(--text-2);max-width:60ch}
.liga-sum strong{color:var(--text)}
.ok{color:var(--win);font-weight:600}
.lrow{grid-template-columns:40px minmax(0,1fr) auto auto 16px}
.lrow .gap{font-size:13px;color:var(--text-3);text-align:right;min-width:40px}
.lrow .paid{display:none}
.chev{width:16px;height:16px;color:var(--text-3)}
.row[data-player]{
  /* the highlight bleeds 12px past the content so it reads as a whole row, content stays aligned */
  margin:0 -12px;width:calc(100% + 24px);padding:12px;border-radius:14px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .15s,transform .15s;
}
.row[data-player] .chev{transition:transform .15s,color .15s}
@media (hover:hover){
  .row[data-player]:hover{--row-bg:color-mix(in srgb,var(--text) 5%,var(--surface));background:var(--row-bg)}
  .row[data-player]:hover .chev{transform:translateX(3px);color:var(--text-2)}
}
.row[data-player]:active{--row-bg:color-mix(in srgb,var(--text) 10%,var(--surface));background:var(--row-bg);transform:scale(.985)}
/* hide the dividers touching a highlighted row so its rounded corners stay clean */
.rows>li:has(>.row[data-player]:is(:hover,:active,:focus-visible)),
.rows>li:has(+ li>.row[data-player]:is(:hover,:active,:focus-visible)){border-bottom-color:transparent}
.row[data-player]:focus-visible{outline-offset:-2px;border-radius:14px}
@media (min-width:760px){
  .lrow{grid-template-columns:40px minmax(0,1fr) 70px 70px 90px 16px}
  .lrow .paid{display:block;text-align:right;font-weight:600}
  .lhead{display:grid !important}
}
.lhead{display:none;grid-template-columns:40px minmax(0,1fr) 70px 70px 90px 16px;gap:12px;padding:0 0 8px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-3)}
.lhead span:nth-child(n+3){text-align:right}

/* ───────── Perfil do jogador ───────── */
.perfil{display:grid;gap:16px}
@media (min-width:900px){
  .perfil{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
  .perfil .player-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
  .perfil .player-card{grid-row:1 / span 3}
  .perfil > .panel{grid-column:2}
}
.player-card{
  position:relative;overflow:hidden;border-radius:var(--r-lg);color:#fff;
  background:linear-gradient(110deg,var(--deep) 0 60%,var(--wine) 60% 79%,var(--cherry) 79% 87%,var(--deep) 87%);
  padding:18px 20px 20px;display:grid;gap:20px;
}
.player-card .icon-btn{width:40px;height:40px}
.pc-id{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.pc-face{width:96px;height:96px;border-radius:999px;object-fit:cover;box-shadow:0 0 0 3px #fff,0 10px 28px rgba(0,0,0,.35)}
.pc-name{margin:0;font:700 clamp(30px,9vw,44px)/.92 var(--display);text-transform:uppercase;letter-spacing:-.02em;overflow-wrap:anywhere}
.pc-name span{display:block}
.pc-pos{margin:8px 0 0;display:flex;align-items:center;gap:8px;font-weight:600}
.pc-pos .move.up{color:#80CC80} .pc-pos .move.down{color:#E07A8B}
.pc-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.pc-foot p{margin:0}
.pc-foot .v{margin-top:6px;font:700 22px/1.1 var(--display)}
.pc-foot .s{margin-top:2px;font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.weeks{display:grid;grid-template-columns:44px repeat(var(--n,10),minmax(0,1fr));column-gap:4px;row-gap:6px;align-items:end}
.wk{position:relative;height:150px;display:flex;align-items:flex-end}
.wk .b{width:100%;border-radius:6px 6px 2px 2px;display:flex;justify-content:center;font-size:11px;font-weight:700;padding-top:4px}
.wk .b.won{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.wk .best{position:absolute;left:-2px;right:-2px;height:2px;border-radius:2px;background:var(--text)}
.weeks .lbl{font-size:12px;color:var(--text-3);align-self:center}
.weeks .c{font-size:11px;text-align:center;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.weeks .c.gw{color:var(--text-3);font-weight:600}
.weeks .c.zero{color:var(--win);font-weight:700}
.legend-line{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:12px;color:var(--text-3)}
.legend-line i{display:block;width:16px;height:2px;border-radius:2px;background:var(--text)}

.facts{margin:0;display:grid}
.facts>div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.facts>div:last-child{border-bottom:0}
.facts dt{color:var(--text-2);font-size:14px}
.facts dd{margin:0;font-weight:600;text-align:right}
.facts dd small{display:block;font-size:12px;font-weight:500;color:var(--text-3)}
.facts .toks{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.facts .tok{min-width:0;padding:0 8px}
.facts .tok.free{color:var(--text-3)}

/* ───────── Números ───────── */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text-2);background:var(--surface)}
.seg button[aria-selected="true"]{background:var(--text);color:var(--ink);border-color:transparent}
@media (min-width:760px){.seg{margin:0 0 16px;padding:0}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0}
.heat{border-spacing:3px;width:100%;min-width:420px}
.heat th{font-size:12px;font-weight:600;color:var(--text-3);padding:4px 2px}
.heat th[scope="row"]{text-align:left;color:var(--text-2);font-size:13px;white-space:nowrap;padding-right:8px;position:sticky;left:0;background:var(--surface)}
.heat td{padding:0}
.cell{display:grid;place-items:center;height:32px;border-radius:7px;font-size:13px;font-weight:600}
.cell.best{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.heat{border-spacing:5px}
.heat .wins{color:var(--text);font-weight:700;text-align:center}
.scale{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--text-3)}
.scale i{display:block;width:120px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--good),var(--cell),var(--bad))}

.bump svg{width:100%;height:auto;max-height:380px;display:block}
.bump .base{fill:none;stroke:var(--text-3);stroke-width:1.5;opacity:.35}
.bump .hl{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.bump text{fill:var(--text-3);font:500 12px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.legend button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--text-2)}
.legend button img{width:22px;height:22px;border-radius:999px;object-fit:cover;filter:grayscale(1);opacity:.6;box-shadow:0 0 0 2px transparent;transition:filter .2s,opacity .2s}
.legend button[aria-pressed="true"]{color:var(--text);background:var(--surface-2)}
.c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
.legend button[aria-pressed="true"] img{filter:none;opacity:1;box-shadow:0 0 0 2px var(--c)}

.big{font:700 20px/1 var(--display);text-align:right}

.chips{width:100%}
.chips th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:0 4px 8px}
.chips td{padding:8px 4px;border-top:1px solid var(--line)}
.chips td:first-child{font-weight:600;white-space:nowrap}
.tok{display:inline-grid;place-items:center;min-width:36px;height:26px;padding:0 6px;border-radius:7px;font-size:12px;font-weight:700}
.tok.used{background:var(--wine);color:#fff}
.tok.free{border:1.5px dashed var(--line);color:transparent}
:root .tok.free{border-color:color-mix(in srgb,var(--text) 22%,transparent)}
.chips .count{color:var(--text-3);font-weight:600;text-align:right}
.lg{display:none}
@media (min-width:640px){.lg{display:inline}.sm{display:none}}

.sim{border-spacing:3px;margin:0 -3px}
.sim thead th{padding:0 0 2px;text-align:center}
.sim thead .av-sm{display:block;margin:0 auto}
.sim tbody th{text-align:left;font-size:13px;font-weight:600;white-space:nowrap;padding-right:4px;position:sticky;left:0;background:var(--surface);z-index:1}
.sim td{padding:0}
.simc{width:100%;min-width:24px;height:32px;border-radius:7px;font-size:13px;font-weight:700;display:grid;place-items:center;transition:transform .12s}
@media (hover:hover){.simc:hover{transform:scale(1.08)}}
.simc.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.pair{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pair-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.pair-faces{display:flex}
.pair-faces img{width:36px;height:36px;border-radius:999px;object-fit:cover;box-shadow:0 0 0 2px var(--surface)}
.pair-faces img+img{margin-left:-10px}
.pair-title{margin:0;font-weight:600}
.pair-n{margin:0;color:var(--text-3);font-size:13px}
.pair-n strong{font:700 24px/1 var(--display);color:var(--text);margin-right:4px}
.pair-lists{margin:14px 0 0;display:grid;gap:10px}
.pair-lists dt{font-size:12px;font-weight:600;color:var(--text-3)}
.pair-lists dd{margin:2px 0 0;font-size:14px;line-height:1.45}
@media (min-width:640px){.pair-lists{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}

/* ───────── Liquid glass navigation ─────────
   Material = translucent tint + blur and saturation boost on what is behind,
   a specular rim (bright top-left, fading round the edge) and a soft top sheen.
   The selected item sits on a "lens" that springs between items.            */
.glass{
  position:relative;isolation:isolate;
  background:var(--glass-tint);
  -webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.04);
  backdrop-filter:blur(14px) saturate(190%) brightness(1.04);
  box-shadow:var(--glass-shadow);
}
.glass::before{ /* specular rim, 1px, brightest where the light hits */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(155deg,var(--glass-rim) 0%,var(--glass-rim-low) 32%,transparent 55%,var(--glass-rim-low) 78%,var(--glass-rim) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass::after{ /* sheen on the upper half */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(130% 90% at 50% -30%,var(--glass-sheen),transparent 62%);
}
.lens{
  position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;z-index:0;pointer-events:none;
  background:var(--lens);
  box-shadow:inset 0 1px 0 var(--lens-hi),inset 0 0 0 .5px var(--glass-rim-low);
  transition:transform .5s cubic-bezier(.3,1.45,.55,1),width .5s cubic-bezier(.3,1.45,.55,1),scale .25s ease;
}
.lens.press{scale:1.12}
/* Segmented control inside a card: solid track, raised thumb that slides */
.segctl{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:12px;border-radius:999px;
  background:color-mix(in srgb,var(--text) 7%,var(--surface))}
.segctl .lens{background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.segctl button{position:relative;z-index:1;padding:9px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text-2);transition:color .2s}
.segctl button[aria-selected="true"]{color:var(--text)}
.lens.no-anim{transition:none}

.tabbar{
  position:fixed;z-index:25;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  width:min(calc(100% - 32px),300px);height:64px;padding:4px;border-radius:999px;
  display:grid;grid-template-columns:repeat(2,1fr);
  transition:width .4s cubic-bezier(.3,1.2,.5,1),height .4s cubic-bezier(.3,1.2,.5,1);
}
.tabbar button{
  position:relative;z-index:1;display:grid;justify-items:center;align-content:center;gap:2px;
  border-radius:999px;font-size:11px;font-weight:600;color:var(--text-2);
  -webkit-tap-highlight-color:transparent;
}
.tabbar svg{width:24px;height:24px;transition:scale .25s}
.tabbar button span{display:block;max-height:14px;transition:opacity .2s,max-height .3s}
.tabbar button[aria-current="page"]{color:var(--nav-on)}
.tabbar button:active svg{scale:.9}
/* Shrinks while you scroll down, like iOS 26; comes back on scroll up */
.tabbar.compact{width:min(calc(100% - 32px),150px);height:50px}
.tabbar.compact button span{opacity:0;max-height:0}
.tabbar.compact svg{width:22px;height:22px}
/* Soft fade so text scrolling under the bar never fights with the labels */
.edge{position:fixed;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom,0px));z-index:24;pointer-events:none;
  background:linear-gradient(to top,color-mix(in srgb,var(--ink) 70%,transparent),transparent)}
@media (min-width:760px){.tabbar,.edge{display:none}}


.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--text);color:var(--ink);padding:12px 18px;width:max-content;max-width:calc(100vw - 32px);text-align:center;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
/* Gameweek under way */
.prov-banner{margin:0 0 16px;padding:12px 16px;border-radius:var(--r-md);font-size:14px;line-height:1.45;color:var(--text);
  background:color-mix(in oklab,var(--cherry) 14%,var(--surface));border:1px solid color-mix(in oklab,var(--cherry) 35%,transparent)}
.prov-banner[hidden]{display:none}
.md-state{align-self:flex-start;margin:-8px 0 -10px}
.md-state[hidden]{display:none}
.md-state .pill{display:inline-block;padding:4px 10px;border-radius:999px;font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;background:rgba(232,199,102,.18);color:#E8C766}
.fail-msg{padding:32px 16px;text-align:center;color:var(--text-2)}
</style>

/* Quem tem fotografia em assets/avatars/<id em minúsculas>.jpg. Os outros ficam com as iniciais. */
const ID_BY_NAME = {
  'Bernardo Saraiva':'B', 'Miguel Antunes':'M', 'Diogo Lopes':'DL', 'Diogo Amarelo':'DA', 'João Leitão':'JL',
  'António Moreira':'AM', 'João Pires':'JP', 'Rui Bimba':'RB', 'Tiago Monteiro':'TM'

const CHIP_NAMES = {WC:'Wildcard', BB:'Bench Boost', TC:'Triple Captain', FH:'Free Hit'};
const CHIP_CODE = {'Wildcard':'WC', 'Bench Boost':'BB', 'Triple Captain':'TC', 'Free Hit':'FH'};

/* Preenchido por buildData() */
let NGW = 0;                 /* última jornada com pontos (pode ser provisória) */
let PLAYERS = [];            /* [{id, name, short}] */
let P = {};                  /* id → jogador */
let AVATARS = {};            /* id → imagem */
let NET = {};                /* id → pontos líquidos por jornada (pontos − transferências) */
let HITS = {};               /* jornada → id → custo de transferências */
let CHIPS = {};              /* id → {WC:[jornadas], …} */
let BENCH = null;            /* id → {total, worst:[pts, jornada]}; sem jornadas com Bench Boost */
let CAPS = null;             /* id → {eff, lost, right} */
let XI = {}, XIN = {}, XIGW = null;   /* id → ids dos 11 titulares; id FPL → nome; jornada dos onzes */
let PAGAMENTOS = {};         /* id → [{data|null, valor}] */
let UNKNOWN_PAY = [];        /* nomes de MANUAL_PAYMENTS que não são jogadores */

const shared = (a, b) => XI[a].filter(p => XI[b].includes(p));
const nm = ids => ids.map(i => XIN[i] || XIN[String(i)] || '?');
const chipCount = id => Object.values(CHIPS[id] || {}).reduce((t, g) => t + g.length, 0);
const capsOrder = () => Object.keys(CAPS).sort((a, b) => CAPS[b].eff - CAPS[a].eff || CAPS[a].lost - CAPS[b].lost || byName(a, b));
const benchOrder = () => Object.keys(BENCH).sort((a, b) => BENCH[b].total - BENCH[a].total || byName(a, b));
const placeholder = (name) => 'data:image/svg+xml,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="#5C1A2A"/><text x="48" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="38" fill="#fff">${
    name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()}</text></svg>`);

function buildData(d){
  const num = k => +String(k).replace(/\D/g, '');
  const gwsWithPoints = Object.keys(d.matchweeks || {}).map(num).sort((a, b) => a - b);
  NGW = gwsWithPoints.length ? gwsWithPoints[gwsWithPoints.length - 1] : 0;

  const firsts = {};
  d.players.forEach(p => { const f = p.name.split(' ')[0]; firsts[f] = (firsts[f] || 0) + 1; });
  PLAYERS = d.players.map(p => {
    const parts = p.name.split(' '), f = parts[0];
    return { id: ID_BY_NAME[p.name] || String(p.entry), name: p.name,
             short: firsts[f] > 1 && parts.length > 1 ? `${f} ${parts[parts.length - 1][0]}.` : f };
  });
  P = Object.fromEntries(PLAYERS.map(p => [p.id, p]));
  AVATARS = Object.fromEntries(PLAYERS.map(p => [p.id, ID_BY_NAME[p.name] ? `assets/avatars/${p.id.toLowerCase()}.jpg` : placeholder(p.name)]));

  NET = {}; HITS = {};
  PLAYERS.forEach(p => {
    NET[p.id] = [...Array(NGW)].map((_, k) => {
      const key = `GW${k + 1}`, hit = d.transfers?.[key]?.[p.name] ?? 0;
      if (hit > 0) (HITS[k + 1] ||= {})[p.id] = hit;
      return (d.matchweeks[key]?.[p.name] ?? 0) - hit;
    });
  });
  PROV = new Map((d.provisional || []).filter(p => p.gw <= NGW).map(p => [p.gw, p]));

  CHIPS = {};
  PLAYERS.forEach(p => {
    const o = {};
    for (const [full, gws] of Object.entries(d.chips_used?.[p.name] || {})) {
      if (CHIP_CODE[full]) o[CHIP_CODE[full]] = [].concat(gws).map(num).sort((a, b) => a - b);
    }
    CHIPS[p.id] = o;
  });

  BENCH = null;
  if (d.bench) {
    BENCH = {};
    PLAYERS.forEach(p => {
      let total = 0, worst = [0, 0];
      for (let g = 1; g <= NGW; g++) {
        const v = d.bench[`GW${g}`]?.[p.name];
        if (v == null || (CHIPS[p.id].BB || []).includes(g)) continue;   /* Bench Boost: o banco conta */
        total += v; if (v > worst[0]) worst = [v, g];
      }
      BENCH[p.id] = { total, worst };
    });
  }

  CAPS = null;
  if (d.captains) {
    CAPS = {};
    PLAYERS.forEach(p => {
      let got = 0, best = 0, right = 0, lost = 0, n = 0;
      for (let g = 1; g <= NGW; g++) {
        const c = d.captains[`GW${g}`]?.[p.name]; if (!c) continue;
        n++; got += c.pts; best += c.best_pts; if (c.pts >= c.best_pts) right++;
        lost += (c.best_pts - c.pts) * (c.mult - 1);
      }
      if (n) CAPS[p.id] = { eff: best ? Math.round(100 * got / best) : 0, lost, right };
    });
    if (!Object.keys(CAPS).length) CAPS = null;
  }

  XI = {}; XIN = d.xi_names || {}; XIGW = null;
  const xiGws = Object.keys(d.xi || {}).map(num).sort((a, b) => a - b);
  if (xiGws.length) {
    const g = xiGws[xiGws.length - 1], row = d.xi[`GW${g}`] || {};
    if (PLAYERS.every(p => Array.isArray(row[p.name]) && row[p.name].length)) {
      PLAYERS.forEach(p => { XI[p.id] = row[p.name]; });
      XIGW = g;
    }
  }

  PAGAMENTOS = {}; UNKNOWN_PAY = [];
  for (const [name, v] of Object.entries(MANUAL_PAYMENTS)) {
    const pl = PLAYERS.find(p => p.name === name);
    if (!pl) { UNKNOWN_PAY.push(name); continue; }
    PAGAMENTOS[pl.id] = Array.isArray(v) ? v : (v > 0 ? [{ data: null, valor: v }] : []);
  }
  UPDATED = d.updated_at || null;
  COVER = {};
}

const $ = s => document.querySelector(s);
const eur = n => new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n);
const byName = (a,b) => P[a].name.localeCompare(P[b].name,'pt');
const hitsThrough = (id,g) => { let t=0; for(let k=1;k<=g;k++) t += (HITS[k]||{})[id] || 0; return t; };
const chipAt = (id,g) => Object.keys(CHIPS[id]||{}).find(k => CHIPS[id][k].includes(g));

function week(g){
  const best = Math.max(...PLAYERS.map(p => NET[p.id][g-1]));
  return PLAYERS.map(p => {
    const net = NET[p.id][g-1], hit = (HITS[g]||{})[p.id] || 0;
    return {id:p.id, net, hit, raw:net+hit, chip:chipAt(p.id,g), gap:best-net, debt:+((best-net)*COST).toFixed(2)};
  }).sort((a,b) => b.net - a.net || byName(a.id,b.id));
}
const cum = (id,g) => NET[id].slice(0,g).reduce((s,v) => s+v, 0);
const order = g => PLAYERS.map(p => p.id).sort((a,b) => cum(b,g) - cum(a,g) || hitsThrough(a,g) - hitsThrough(b,g) || byName(a,b));
const owedThrough = (id, upTo) => { let t=0; for(let g=1; g<=upTo; g++) t += week(g).find(r => r.id===id).debt; return +t.toFixed(2); };
const owedSeason = id => owedThrough(id, NGW);
/* 0 = best of the week, 1 = worst */
function weekT(id,g){
  const vals = PLAYERS.map(p => NET[p.id][g-1]).sort((a,b) => b-a);
  const v = NET[id][g-1];
  const first = vals.indexOf(v), last = vals.lastIndexOf(v);
  return ((first+last)/2) / (vals.length-1);
}
function heat(t){
  const good = t <= .5, p = Math.round(Math.abs(t-.5)/.5*100);
  const bg = `color-mix(in oklab, var(${good?'--good':'--bad'}) ${p}%, var(--cell))`;
  return `background:${bg};color:${p>=70?'#fff':'var(--cell-text)'}`;
}

/* ═════════ Pagamentos ═════════ */
/* For each player: what is left to pay in every week, and which weeks each payment covered.
   Payments are applied in date order to the oldest weeks first. */
let COVER = {};
function coverage(id){
  if (COVER[id]) return COVER[id];
  const left = [...Array(NGW)].map((_, k) => Math.round(week(k+1).find(r => r.id === id).debt * 100));   /* cents, no float drift */
  const pays = [...(PAGAMENTOS[id] || [])].sort((a, b) => (a.data || '').localeCompare(b.data || '')).map(p => ({...p, de: null, ate: null}));
  let k = 0;
  for (const p of pays) {
    let cash = Math.round(p.valor * 100);
    while (k < NGW && cash > 0) {
      if (left[k] === 0) { k++; continue; }
      const take = Math.min(cash, left[k]); left[k] -= take; cash -= take;
      p.de ??= k + 1; p.ate = k + 1;
      if (left[k] === 0) k++;
    }
    p.credito = cash / 100;   /* paid ahead of what is owed */
  }
  return COVER[id] = { left: left.map(c => c / 100), pays };
}
const isPaid = (id, g) => coverage(id).left[g-1] === 0;
const leftIn = (id, g) => coverage(id).left[g-1];
/* what someone still owes, up to a given week */
const owes = (id, upTo = NGW) => +coverage(id).left.slice(0, upTo).reduce((t, v) => t + v, 0).toFixed(2);
const paidSoFar = (id, upTo = NGW) => +(owedThrough(id, upTo) - owes(id, upTo)).toFixed(2);

  if (worst.debt) {
    const sx = W - 64 - 78, sy = 456;
    drawSticker(ctx, 'last', sx, sy, 156, -8);
    drawFace(ctx, faces[worst.id], sx - 62, sy + 54, 34, 5);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
    ctx.font = `600 38px ${BODY}`; ctx.fillText(fit(ctx, P[worst.id].short, 260), sx - 132, 440);
    ctx.font = `700 64px ${DISPLAY}`; ctx.fillText(eur(worst.debt).replace(/\s/g,' '), sx - 132, 508);
    ctx.textAlign = 'left';
  }

  /* table */
  const tx = 40, ty = 610, tw = W - 80, rh = 62, th = rows.length * rh + 28;
  ctx.fillStyle = 'rgba(15,10,15,.42)'; ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 28); ctx.fill();
  rows.forEach((r, i) => {
    const y = ty + 14 + i * rh, mid = y + rh/2;
    if (i) { ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(tx + 28, y, tw - 56, 1.5); }
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `600 26px ${BODY}`; ctx.fillText(String(i+1), tx + 32, mid + 9);
    drawFace(ctx, faces[r.id], tx + 102, mid, 21, 0);
    ctx.fillStyle = '#fff'; ctx.font = `600 32px ${BODY}`; ctx.fillText(fit(ctx, P[r.id].name, 430), tx + 140, mid + 11);
    ctx.textAlign = 'right'; ctx.fillStyle = '#80CC80'; ctx.font = `700 32px ${BODY}`; ctx.fillText(String(r.net), tx + 700, mid + 11);
    const paid = isPaid(r.id, g);
    ctx.fillStyle = !r.debt ? '#80CC80' : paid ? '#fff' : '#E07A8B';
    ctx.font = r.debt ? `700 32px ${BODY}` : `600 26px ${BODY}`;
    ctx.fillText(r.debt ? eur(r.debt) : 'Não paga', tx + tw - 32, mid + 11);
  });

  /* footer */
  const pot = rows.reduce((t, r) => t + r.debt, 0), due = rows.reduce((t, r) => t + leftIn(r.id, g), 0);
  ctx.textAlign = 'left';
  ctx.font = '30px system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"'; ctx.fillText('💰', 64, ty + th + 67);
  eyebrow('POTE', 106, ty + th + 64);
  ctx.fillStyle = '#fff'; ctx.font = `700 44px ${DISPLAY}`; ctx.fillText(eur(pot), 222, ty + th + 70);
  ctx.textAlign = 'right'; ctx.font = `600 28px ${BODY}`;
  ctx.fillStyle = due ? '#E07A8B' : '#80CC80'; ctx.fillText(due ? `falta ${eur(due)}` : 'tudo pago', W - 64, ty + th + 66);

  return new Promise(res => ctx.canvas.toBlob(res, 'image/png'));
}

/* Share sheet: preview, then the phone's share sheet (or a download where that isn't available) */
let sheetFile = null, sheetUrl = null, lastFocus = null, sheetTitle = '';
async function openShare(make = () => jornadaImage(gw), name = `fantasy-fundao-jornada-${gw}.png`, title = `Jornada ${gw}`){
  lastFocus = document.activeElement; sheetTitle = title;
  /* the sheet appears immediately; the image fills in when it is ready */
  $('#sheet-img').removeAttribute('src'); $('#sheet-card').setAttribute('aria-busy', 'true'); $('#sheet-go').disabled = true;
  $('#sheet').hidden = false; document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => $('#sheet').classList.add('open'));
  const blob = await make();
  sheetFile = new File([blob], name, {type: 'image/png'});
  if (sheetUrl) URL.revokeObjectURL(sheetUrl);
  sheetUrl = URL.createObjectURL(blob);
  $('#sheet-img').src = sheetUrl;
  const canFiles = !!(navigator.canShare && navigator.canShare({files: [sheetFile]}));
  $('#sheet-go').textContent = canFiles ? 'Partilhar' : 'Guardar imagem';
  $('#sheet-go').dataset.mode = canFiles ? 'share' : 'save';
  $('#sheet-card').removeAttribute('aria-busy'); $('#sheet-go').disabled = false;
  $('#sheet-go').focus();
}
function closeShare(){
  $('#sheet').classList.remove('open'); document.body.style.overflow = '';
  setTimeout(() => { $('#sheet').hidden = true; }, 220);
  lastFocus && lastFocus.focus();
}
$('#share').onclick = () => openShare();
$('#sheet-go').onclick = async () => {
  if ($('#sheet-go').dataset.mode === 'share') {
    try { await navigator.share({files: [sheetFile], title: sheetTitle}); closeShare(); } catch (e) { /* dismissed */ }
  } else {
    const a = Object.assign(document.createElement('a'), {href: sheetUrl, download: sheetFile.name});
    document.body.append(a); a.click(); a.remove(); toast('Imagem guardada');
  }
};

/* one list layout for every ranked table */
async function drawList(ctx, box, {head = [], rows, total}){
  const faces = await facesFor(rows.filter(r => r.id).map(r => r.id));
  const top = box.y + (head.length ? 70 : 20), avail = box.y + box.h - top - (total ? 90 : 20);
  const rh = Math.min(92, avail / rows.length);
  ctx.font = `600 22px ${BODY}`; ctx.fillStyle = IMG.mute;
  head.forEach(h => { ctx.textAlign = h.align || 'right'; ctx.fillText(h.t, box.x + h.x, box.y + 50); });
  rows.forEach((r, i) => {
    const y = top + i*rh, mid = y + rh/2;
    if (i) { ctx.fillStyle = IMG.line; ctx.fillRect(box.x + 28, y, box.w - 56, 1.5); }
    ctx.textAlign = 'left'; ctx.fillStyle = r.rankColor || IMG.mute; ctx.font = `600 26px ${BODY}`; ctx.fillText(r.rank, box.x + 30, mid + 9);
    let nx = box.x + 88;
    if (r.id) { drawFace(ctx, faces[r.id], box.x + 110, mid, 22, 0); nx = box.x + 148; }
    ctx.fillStyle = r.nameColor || '#fff'; ctx.font = `600 32px ${BODY}`;
    const name = fit(ctx, r.name, r.nameMax || 400);
    ctx.fillText(name, nx, r.sub ? mid - 2 : mid + 11);
    if (r.badge) { const bw = ctx.measureText(name).width; ctx.font = `700 22px ${BODY}`; ctx.fillStyle = r.badge.c; ctx.fillText(r.badge.t, nx + bw + 12, (r.sub ? mid - 2 : mid + 11) - 2); }
    if (r.sub) { ctx.fillStyle = r.subColor || IMG.mute; ctx.font = `500 22px ${BODY}`; ctx.fillText(r.sub, nx, mid + 28); }
    r.cells.forEach(c => { ctx.textAlign = c.align || 'right'; ctx.fillStyle = c.c || '#fff'; ctx.font = c.f || `700 32px ${BODY}`; ctx.fillText(c.t, box.x + c.x, mid + 11); });
  });
  if (total) {
    const y = box.y + box.h - 72; ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(box.x + 28, y - 12, box.w - 56, 2);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = `700 30px ${BODY}`; ctx.fillText(total.label, box.x + 30, y + 34);
    ctx.textAlign = 'right'; ctx.font = `700 44px ${DISPLAY}`; ctx.fillStyle = total.c || '#fff'; ctx.fillText(total.t, box.x + box.w - 32, y + 38);
  }
}

const slug = id => 'jogador-' + id.toLowerCase();

function renderPerfil(id){
  const now = order(NGW), before = order(NGW-1), i = now.indexOf(id), c = cum(id,NGW);
  const weeks = [...Array(NGW)].map((_,k) => { const g = k+1, w = week(g), me = w.find(r => r.id === id);
    return {g, net:me.net, best:w[0].net, debt:me.debt, won:w[0].net === me.net, rank:order(g).indexOf(id)+1}; });
  const [first, ...rest] = P[id].name.split(' ');

  $('#pf-name').innerHTML = `<span>${first}</span><span>${rest.join(' ')}</span>`;
  $('#pf-pos').innerHTML = `${ord(i+1)} lugar ${moveHTML(i, before.indexOf(id))}`;

  $('#pf-prev').onclick = () => go(slug(now[i-1]), true);
  $('#pf-next').onclick = () => go(slug(now[i+1]), true);

  /* Card: points, the gap that matters to this player, money */
  const gapStat = i === 0
    ? `<p class="eyebrow">Vantagem</p><p class="v num">${c - cum(now[1],NGW)}</p><p class="s">sobre ${P[now[1]].short}</p>`
    : `<p class="eyebrow">Para subir</p><p class="v num">${cum(now[i-1],NGW) - c}</p><p class="s">até ${P[now[i-1]].short}</p>`;
  $('#pf-foot').innerHTML = `
    <div><p class="eyebrow">Pontos</p><p class="v num">${c}</p></div>
    <div>${gapStat}</div>
    <div>${owes(id) ? `<p class="eyebrow">Deve</p><p class="v num">${eur(owes(id))}</p><p class="s">pago ${eur(paidSoFar(id))}</p>`
                     : `<p class="eyebrow">Pago</p><p class="v num">${eur(paidSoFar(id))}</p>`}</div>`;

  /* Week by week: bar = points, line = the week's best, below = what it cost and where it left you */
  const max = Math.max(...PLAYERS.flatMap(p => NET[p.id]));
  $('#pf-weeks').style.setProperty('--n', NGW);
  $('#pf-weeks').innerHTML =
    `<span></span>` + weeks.map(w => `<div class="wk" title="J${w.g}: ${w.net} pts, melhor ${w.best}">
        <span class="best" style="bottom:calc(${(w.best/max*100).toFixed(1)}% - 1px)" aria-hidden="true"></span>
        <span class="b num ${w.won?'won':''}" style="height:${(w.net/max*100).toFixed(1)}%;${heat(weekT(id,w.g))}">${w.net}</span>
      </div>`).join('') +
    `<span></span>` + weeks.map(w => `<span class="c gw">J${w.g}${PROV.has(w.g) ? '*' : ''}</span>`).join('') +
    `<span class="lbl">Lugar</span>` + weeks.map(w => `<span class="c num">${ord(w.rank)}</span>`).join('');

  /* Debt: season total, where that sits in the league, and every week */
  const paidRank = PLAYERS.map(p => p.id).sort((a, b) => owedSeason(a) - owedSeason(b) || byName(a, b)).indexOf(id) + 1;
  $('#pf-debt-sum').innerHTML = `<span class="v num">${eur(owedSeason(id))}</span>
    <span class="s">na época, ${paidRank === 1 ? 'quem menos pagou' : paidRank === PLAYERS.length ? 'quem mais pagou' : `${ord(paidRank)} que menos pagou`}</span>
    <span class="debt-state">${owes(id) ? `Pago ${eur(paidSoFar(id))}, <span class="due-txt">falta ${eur(owes(id))}</span>` : `<span class="ok">Tudo pago</span>${(c => c ? `, ${eur(c)} a favor` : '')(coverage(id).pays.reduce((t, p) => t + p.credito, 0))}`}</span>`;
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  $('#pf-debt-weeks').innerHTML = weeks.map(w => {
    const left = leftIn(id, w.g), paid = w.debt && !left, part = left && left < w.debt;
    return `<li class="${w.won ? 'won' : ''} ${left ? 'due' : ''} ${paid ? 'paid' : ''}">
      <span class="g">J${w.g}${paid ? `<span class="tick">${CHECK}</span><span class="sr"> pago</span>` : ''}</span><span class="a">${w.won ? 'Ganhou' : eur(w.debt)}</span>
      ${left ? `<span class="left">${part ? `falta ${eur(left)}` : 'por pagar'}</span>` : ''}
    </li>`; }).join('');
  const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const fmtDate = d => { const [, m, day] = d.split('-').map(Number); return `${day} ${MESES[m-1]}`; };
  const pays = coverage(id).pays;
  $('#pf-pays').innerHTML = pays.length ? `<h3 class="pays-h">Pagamentos</h3><ol class="pays">${pays.slice().reverse().map(p => `<li>
      <span class="d">${p.data ? fmtDate(p.data) : 'Pago'}</span>
      <span class="r">${p.de ? (p.de === p.ate ? `J${p.de}` : `J${p.de} a J${p.ate}`) : ''}${p.credito ? `${p.de ? ', ' : ''}${eur(p.credito)} a favor` : ''}</span>
      <span class="v num">${eur(p.valor)}</span></li>`).join('')}</ol>` : '';
  $('#share-debt').onclick = () => openShare(() => debtImage(id), `fantasy-fundao-divida-${id.toLowerCase()}.png`, `Dívida de ${P[id].short}`);

  /* Season facts */
  const won = weeks.filter(w => w.won).map(w => 'J' + w.g);
  const best = weeks.reduce((a,b) => b.net > a.net ? b : a);
  const k = CAPS[id], b = BENCH[id];
  const chips = Object.keys(CHIP_NAMES).map(ch => { const gs = (CHIPS[id]||{})[ch] || [];
    return gs.length ? `<span class="tok used" title="${CHIP_NAMES[ch]}">${ch} ${gs.map(g => 'J' + g).join(' ')}</span>` : `<span class="tok free" title="${CHIP_NAMES[ch]} por usar">${ch}</span>`; }).join('');
  const lead = now[0];
  const rows = [
    ['Jornadas ganhas', won.length ? `${won.length}<small>${won.join(', ')}</small>` : 'Nenhuma'],
    ['Melhor jornada', `${best.net} pts<small>J${best.g}</small>`],
    ...(k ? [['Capitão', `${k.eff} % de acerto<small>${k.lost} pts perdidos</small>`]] : []),
    ...(b ? [['Banco', `${b.total} pts<small>pior: ${b.worst[0]} na J${b.worst[1]}</small>`]] : []),
    ['Chips', `<span class="toks">${chips}</span>`],
  ];
  if (XIGW && XI[id]) {
    const twin = PLAYERS.map(p => p.id).filter(o => o !== id && XI[o]).map(o => [o, shared(id, o).length]).reduce((x, y) => !x || y[1] > x[1] ? y : x, null);
    if (twin) rows.push(['Onze mais parecido', `${P[twin[0]].short}<small>${twin[1]} de 11 na J${XIGW}</small>`]);
  }
  $('#pf-facts').innerHTML = rows.map(([t,v]) => `<div><dt>${t}</dt><dd class="num">${v}</dd></div>`).join('');
}
$('#pf-back').onclick = () => go(backTo || 'liga');

/* ═════════ Números ═════════ */
const ALL_STATS = [
  {id:'forma',    label:'Forma',    has: () => true},
  {id:'evolucao', label:'Evolução', has: () => NGW > 1},
  {id:'capitaes', label:'Capitães', has: () => !!CAPS},
  {id:'banco',    label:'Banco',    has: () => !!BENCH},
  {id:'chips',    label:'Chips',    has: () => true},
  {id:'onzes',    label:'Onzes',    has: () => !!XIGW}
];
let stat = 'forma';
let highlight = [];
let onzePair = null;   /* [a, b] shown under the grid; defaults to the most alike pair */

const CAPTIONS = {
  forma: 'Os pontos de cada um em cada jornada, com a cor da posição nessa semana. O contorno marca quem ganhou.',
  evolucao: 'O lugar de cada um na classificação depois de cada jornada. Toca num nome para o comparar.',
  capitaes: 'Pontos dos capitães a dividir pelos do melhor jogador de cada onze, na época toda.',
  banco: 'Pontos que ficaram no banco e não contaram. Jornadas com Bench Boost não entram.',
  chips: 'Quando cada um usou os chips (cada um pode usar dois de cada). Tracejado é por usar.',
  onzes: 'Quantos titulares cada par tem em comum. Toca num quadrado para ver quais.'
};

const VIEWS = {
  forma(){
    const ids = order(NGW);
    const gws = [...Array(NGW)].map((_,i) => i+1);
    const wins = id => gws.filter(g => week(g)[0].id === id).length;
    return `<div class="scroll"><table class="heat"><thead><tr><th></th>${gws.map(g => `<th scope="col">J${g}${PROV.has(g) ? '*' : ''}</th>`).join('')}<th scope="col" title="Jornadas ganhas">Vit.</th></tr></thead><tbody>` +
    ids.map(id => `<tr><th scope="row"><span class="who-cell">${avSm(id)}${P[id].short}</span></th>${gws.map(g => {
      const best = week(g)[0].net === NET[id][g-1];
      return `<td><span class="cell num ${best?'best':''}" style="${heat(weekT(id,g))}">${NET[id][g-1]}</span></td>`;
    }).join('')}<td class="wins num">${wins(id) || '—'}</td></tr>`).join('') +
    `</tbody></table></div><div class="scale">Melhor <i></i> Pior da semana</div>`;
  },
  evolucao(){
    const narrow = $('#stat').clientWidth < 560, W = narrow ? 360 : 640, H = narrow ? 280 : 300, L=22, R=24, T=16, B=30, n=PLAYERS.length;
    const x = g => L + (g-1)*(W-L-R)/(NGW-1), y = r => T + r*(H-T-B)/(n-1);
    const pos = {}; for (let g=1; g<=NGW; g++) order(g).forEach((id,r) => (pos[id] ||= [])[g-1] = r);
    const path = id => pos[id].map((r,i) => `${i?'L':'M'}${x(i+1).toFixed(1)} ${y(r).toFixed(1)}`).join('');
    const base = PLAYERS.map(p => `<path class="base" d="${path(p.id)}"/>`).join('');
    const hl = highlight.map((id,i) => `<g style="--c:var(--s${i+1})"><path class="hl" stroke="var(--c)" ${i===2?'stroke-dasharray="7 5"':''} d="${path(id)}"/>${pos[id].slice(0,-1).map((r,g) => `<circle cx="${x(g+1)}" cy="${y(r)}" r="4" fill="var(--c)"><title>${P[id].short}, J${g+1}: ${r+1}.º</title></circle>`).join('')}${(() => {
      const cx = x(NGW), cy = y(pos[id][NGW-1]), rr = narrow ? 11 : 13;
      return `<clipPath id="cp-${id}"><circle cx="${cx}" cy="${cy}" r="${rr}"/></clipPath><image href="${AVATARS[id]}" x="${cx-rr}" y="${cy-rr}" width="${rr*2}" height="${rr*2}" clip-path="url(#cp-${id})" preserveAspectRatio="xMidYMid slice"><title>${P[id].short}, J${NGW}: ${pos[id][NGW-1]+1}.º</title></image><circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="var(--c)" stroke-width="2.5"/>`;
    })()}</g>`).join('');
    const ax = [...Array(NGW)].map((_,i) => `<text x="${x(i+1)}" y="${H-10}" text-anchor="middle">${narrow && NGW > 14 && (NGW - 1 - i) % 2 ? '' : 'J' + (i+1) + (PROV.has(i+1) ? '*' : '')}</text>`).join('') +
               [...Array(n)].map((_,r) => `<text x="4" y="${y(r)+4}">${r+1}</text>`).join('');
    const legend = order(NGW).map(id => {
      const i = highlight.indexOf(id);
      return `<button data-hl="${id}" class="${i>=0?'c'+(i+1):''}" aria-pressed="${i>=0}"><img src="${AVATARS[id]}" alt="">${P[id].short}</button>`;
    }).join('');
    return `<div class="bump"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de posições por jornada">${base}${hl}${ax}</svg></div><div class="legend">${legend}</div>`;
  },
  capitaes(){
    const ids = capsOrder();
    return `<ol class="rows">${ids.map((id,i) => { const k = CAPS[id]; return `<li>
      <button type="button" class="row" data-player="${id}" style="grid-template-columns:40px minmax(0,1fr) auto 16px">
        ${avRank(id, i+1, i === 0 ? 'p1' : '')}
        <div class="who"><div class="n">${P[id].name}</div><div class="sub"><span>${k.lost} pts perdidos</span></div></div>
        <span class="big num">${k.eff}%</span>
        ${CHEV}
      </button>
    </li>`; }).join('')}</ol>`;
  },
  banco(){
    const ids = benchOrder();
    return `<ol class="rows">${ids.map((id,i) => { const b = BENCH[id]; return `<li>
      <button type="button" class="row" data-player="${id}" style="grid-template-columns:40px minmax(0,1fr) auto 16px">
        ${avRank(id, i+1)}
        <div class="who"><div class="n">${P[id].name}</div></div>
        <span class="big num">${b.total}</span>
        ${CHEV}
      </button>
    </li>`; }).join('')}</ol>`;
  },
  chips(){
    const ids = order(NGW);
    return `<div class="scroll"><table class="chips"><thead><tr><th>Jogador</th>${Object.keys(CHIP_NAMES).map(c => `<th><span class="lg">${CHIP_NAMES[c]}</span><span class="sm" title="${CHIP_NAMES[c]}">${c}</span></th>`).join('')}<th style="text-align:right">Total</th></tr></thead><tbody>` +
    ids.map(id => `<tr><td><span class="who-cell">${avSm(id)}${P[id].short}</span></td>${Object.keys(CHIP_NAMES).map(c => {
      const gs = (CHIPS[id]||{})[c] || [];
      return `<td>${[0,1].map(k => gs[k] ? `<span class="tok used">J${gs[k]}</span>` : `<span class="tok free" aria-label="por usar">·</span>`).join(' ')}</td>`;
    }).join('')}<td class="count num">${chipCount(id)}/8</td></tr>`).join('') +
    `</tbody></table></div>`;
  },
  onzes(){
    const ids = order(NGW), n = ids.length;
    /* every pair once */
    const pairs = [];
    for (let r = 1; r < n; r++) for (let c = 0; c < r; c++) pairs.push([ids[r], ids[c], shared(ids[r], ids[c]).length]);
    if (!onzePair) { const top = pairs.reduce((a,b) => b[2] > a[2] ? b : a); onzePair = [top[0], top[1]]; }
    const [a, b] = onzePair, both = shared(a, b);
    const isSel = (x, y) => (x === a && y === b) || (x === b && y === a);
    const tone = k => { const p = Math.min(100, Math.round(k / 8 * 100));
      return `background:color-mix(in oklab, var(--cherry) ${p}%, var(--cell));color:${p >= 55 ? '#fff' : 'var(--cell-text)'}`; };

    const grid = `<table class="sim"><thead><tr><th></th>${ids.slice(0, -1).map(c =>
        `<th scope="col"><img class="av-sm" src="${AVATARS[c]}" alt="${P[c].short}" title="${P[c].name}"></th>`).join('')}</tr></thead><tbody>` +
      ids.slice(1).map((rid, ri) => `<tr><th scope="row"><span class="who-cell">${avSm(rid)}${P[rid].short}</span></th>${ids.slice(0, -1).map((cid, ci) => {
        if (ci > ri) return '<td></td>';
        const k = shared(rid, cid).length;
        return `<td><button class="simc num ${isSel(rid, cid) ? 'on' : ''}" data-pair="${rid},${cid}" style="${tone(k)}"
          aria-pressed="${isSel(rid, cid)}" aria-label="${P[rid].short} e ${P[cid].short}: ${k} em comum">${k}</button></td>`;
      }).join('')}</tr>`).join('') + `</tbody></table>`;

    const only = (x, y) => XI[x].filter(p => !XI[y].includes(p));
    const detail = `<div class="pair">
      <div class="pair-head">
        <span class="pair-faces"><img src="${AVATARS[a]}" alt=""><img src="${AVATARS[b]}" alt=""></span>
        <p class="pair-title">${P[a].short} e ${P[b].short}</p>
        <p class="pair-n num"><strong>${both.length}</strong> de 11</p>
      </div>
      <dl class="pair-lists">
        <div><dt>Em comum</dt><dd>${nm(both).join(', ') || 'Nenhum'}</dd></div>
        <div><dt>Só ${P[a].short}</dt><dd>${nm(only(a, b)).join(', ')}</dd></div>
        <div><dt>Só ${P[b].short}</dt><dd>${nm(only(b, a)).join(', ')}</dd></div>
      </dl>
    </div>`;
    return `<div class="scroll">${grid}</div>` + detail;
  }
};

function renderStats(){
  const STATS = ALL_STATS.filter(s => s.has());
  if (!STATS.some(s => s.id === stat)) stat = STATS[0].id;
  $('#seg').innerHTML = STATS.map(s => `<button role="tab" id="t-${s.id}" aria-selected="${s.id===stat}" aria-controls="stat" data-stat="${s.id}">${s.label}</button>`).join('');
  $('#stat').setAttribute('aria-labelledby','t-'+stat);
  $('#stat').innerHTML = VIEWS[stat]() + `<p class="caption">${CAPTIONS[stat]}</p>`;
  document.querySelectorAll('[data-stat]').forEach(b => b.onclick = () => { stat = b.dataset.stat; renderStats(); });
  document.querySelectorAll('[data-pair]').forEach(b => b.onclick = () => { onzePair = b.dataset.pair.split(','); renderStats(); });
  document.querySelectorAll('[data-hl]').forEach(b => b.onclick = () => {
    const id = b.dataset.hl, i = highlight.indexOf(id);
    if (i >= 0) highlight.splice(i,1); else { highlight.push(id); if (highlight.length > 3) highlight.shift(); }
    renderStats();
  });
}

/* ═════════ Navigation ═════════
   #jornada  first tab, week table      #liga     first tab, overall table
   #insights stats (old #numeros still works)                     #jogador-<id>  a player's profile */
const VIEWS_IDS = ['jornada','numeros','perfil'];
let lastView = '';
/* Navigation keeps its own state and only mirrors it in the address bar when the browser allows.
   Inside previews and sandboxed viewers the URL can be locked, so nothing depends on it. */
let route = '', backTo = null, lastPane = 'jornada';
function go(h, replace){
  if (h === route) return;
  if (h.startsWith('jogador-') && !route.startsWith('jogador-')) backTo = route || 'jornada';
  try { history[replace ? 'replaceState' : 'pushState'](null, '', '#' + h); } catch (e) {}
  show(h);
}
function show(h = location.hash.slice(1)){
  route = h;
  const who = h.startsWith('jogador-') ? fromSlug(h) : null;
  if (h === 'numeros') h = route = 'insights';   /* old links */
  const v = who ? 'perfil' : (h === 'insights' ? 'numeros' : 'jornada');
  VIEWS_IDS.forEach(id => $('#v-'+id).hidden = id !== v);
  if (who) renderPerfil(who); else document.title = 'Fantasy Fundão';
  /* first tab: which table */
  const pane = h === 'liga' ? 'liga' : 'jornada';
  if (v === 'jornada') lastPane = pane;
  document.querySelectorAll('.segctl [data-pane]').forEach(b => b.setAttribute('aria-selected', b.dataset.pane === pane));
  $('#pane-jornada').hidden = pane !== 'jornada'; $('#pane-geral').hidden = pane !== 'liga';
  const tab = v === 'numeros' ? 'insights' : 'jornada';   /* profiles live under the first tab */
  document.querySelectorAll('[data-go]').forEach(b => b.dataset.go === tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  if (v !== lastView) window.scrollTo({top:0});   /* switching tables keeps your place */
  lastView = v;
  placeLenses();
  $('.tabbar').classList.remove('compact');
  if (v === 'numeros' && stat === 'evolucao') renderStats();
}
/* The first tab reopens on the table you last looked at */
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go === 'jornada' ? lastPane : b.dataset.go));
document.querySelectorAll('.segctl [data-pane]').forEach(b => b.onclick = () => go(b.dataset.pane, true));
/* iOS Safari only shows :active (the pressed row) when a touch listener exists */
document.addEventListener('touchstart', () => {}, {passive:true});
/* One listener for every player row, wherever it is rendered */
document.addEventListener('click', e => { const row = e.target.closest('[data-player]'); if (row) go(slug(row.dataset.player)); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { placeLenses(true); if (stat === 'evolucao') renderStats(); }, 150); });

/* Liquid glass: the lens follows the current item */
function placeLenses(instant){
  document.querySelectorAll('.glass, .segctl').forEach(nav => {
    const lens = nav.querySelector('.lens'), on = nav.querySelector('[aria-current="page"], [aria-selected="true"]');
    if (!lens || !on) return;
    lens.classList.toggle('no-anim', !!instant);
    if (nav.classList.contains('tabbar')) {
      /* equal columns: use percentages so the lens tracks the bar as it shrinks */
      const items = [...nav.querySelectorAll('[data-go]')], i = items.indexOf(on);
      lens.style.left = '4px'; lens.style.width = `calc((100% - 8px) / ${items.length})`;
      lens.style.transform = `translateX(${i * 100}%)`;
    } else {
      lens.style.width = on.offsetWidth + 'px';
      lens.style.transform = `translateX(${on.offsetLeft}px)`;
    }
    if (instant) requestAnimationFrame(() => lens.classList.remove('no-anim'));
  });
}
/* Touching an item swells the lens slightly, as on iOS */
document.querySelectorAll('.glass [data-go], .segctl [data-pane]').forEach(b => {
  const lens = b.parentElement.querySelector('.lens');
  b.addEventListener('pointerdown', () => lens.classList.add('press'));
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => lens.classList.remove('press')));
});
/* Tab bar shrinks while scrolling down and returns on the way up */
let lastY = scrollY, ticking = false;
addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const y = scrollY, bar = $('.tabbar');
    const sc = y > 16; $('.top').classList.toggle('scrolled', sc); document.body.classList.toggle('scrolled', sc);
    if (y > lastY + 6 && y > 120) bar.classList.add('compact');
    else if (y < lastY - 6 || y < 60) bar.classList.remove('compact');
    lastY = y; ticking = false;
  });
}, {passive:true});

window.addEventListener('hashchange', () => show());
window.addEventListener('popstate', () => show());

/* Notificações (OneSignal). O botão só aparece onde há push: Android, desktop e a app instalada no iPhone
   (iOS 16.4+); num separador do Safari no iPhone não existe push. O OneSignal regista o sw.js (ver CLAUDE.md). */
function setupNotifications(){
  const btn = $('#notif');
  if (!btn || !ONESIGNAL_APP_ID || !location.protocol.startsWith('http')) return;
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;

  const base = location.pathname.replace(/[^/]*$/, '');   /* "/liga-fundao/" no GitHub Pages */
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async OneSignal => {
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      serviceWorkerPath: `${base.slice(1)}sw.js`,   /* sem "/" no início: o SDK resolve a partir da origem */
      serviceWorkerParam: { scope: base },
      notifyButton: { enable: false },              /* o botão é o nosso */
    });
    const sub = OneSignal.User.PushSubscription;
    const render = () => {
      const blocked = Notification.permission === 'denied', on = !!sub.optedIn && !blocked;
      btn.hidden = false; btn.disabled = blocked;
      btn.setAttribute('aria-pressed', on);
      $('#notif-l').textContent = blocked ? 'Notificações bloqueadas no browser' : on ? 'Notificações ativas' : 'Ativar notificações';
    };
    render();
    sub.addEventListener('change', render);
    btn.addEventListener('click', async () => {
      /* optIn(): volta a subscrever se o browser já deu o token, senão mostra o pedido de permissão (tem de vir de um toque) */
      const was = !!sub.optedIn;
      if (was) await sub.optOut(); else await sub.optIn();
      render();
      if (!btn.disabled) toast(was ? 'Notificações desligadas' : 'Vais receber um aviso quando a jornada fechar');
    });
  });
  const sdk = document.createElement('script');
  sdk.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
  sdk.defer = true;
  document.head.appendChild(sdk);   /* offline ou bloqueado: o botão fica escondido */
}

/* Theme: automático / claro / escuro, remembered on this device */
function setTheme(mode, save){
  const root = document.documentElement;
  if (mode === 'auto') delete root.dataset.theme; else root.dataset.theme = mode;
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-checked', b.dataset.themeSet === mode));
  const cur = document.querySelector(`[data-theme-set="${mode}"]`);
  $('#theme-btn').innerHTML = cur.querySelector('svg').outerHTML;
  $('#theme-btn').setAttribute('aria-label', `Tema: ${cur.querySelector('.tl').textContent}`);
  const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = dark ? '#0F0A0F' : '#F5F2F0'; m.removeAttribute('media'); });
  if (save) { try { mode === 'auto' ? localStorage.removeItem('ff-theme') : localStorage.setItem('ff-theme', mode); } catch (e) {} }
}
document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet, true); themeMenu(false); });
/* phone: the theme button opens and closes the menu */
function themeMenu(open){
  const wrap = $('#theme-wrap'); if (open === wrap.classList.contains('open')) return;
  wrap.classList.toggle('open', open); $('#theme-btn').setAttribute('aria-expanded', open);
  if (open) document.querySelector('.theme [aria-checked="true"]').focus();
}
$('#theme-btn').onclick = () => themeMenu(!$('#theme-wrap').classList.contains('open'));
document.addEventListener('click', e => { if (!e.target.closest('#theme-wrap')) themeMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#theme-wrap').classList.contains('open')) { themeMenu(false); $('#theme-btn').focus(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) setTheme('auto'); });
setTheme(document.documentElement.dataset.theme || 'auto');

/* ═════════ Arranque ═════════ */
/* Faixa enquanto há uma jornada a decorrer: os números já entram em tudo, mas podem mudar */
function renderProvBanner(){
  const box = $('#prov-banner');
  if (!PROV.size) { box.hidden = true; return; }
  const parts = [...PROV.values()].map(p => {
    const progress = p.played >= p.total
      ? `todos os ${p.total} jogos terminaram, à espera da confirmação final da FPL`
      : `${p.played} de ${p.total} jogos terminados${p.live ? `, ${p.live} a decorrer` : ''}`;
    return `<strong>${p.played >= p.total ? '⏳' : '🔴'} A J${p.gw} ainda não é final</strong>: ${progress}.`;
  });
  box.innerHTML = `${parts.join('<br>')}<br>Os pontos, as dívidas e as classificações já a incluem, mas <strong>podem mudar</strong> até a FPL a confirmar.`;
  box.hidden = false;
}

function renderFoot(){
  $('#foot-cost').textContent = eur(COST);
  const t = $('#foot-updated');
  if (UPDATED) {
    const dt = new Date(UPDATED);
    t.dateTime = UPDATED;
    t.textContent = dt.toLocaleDateString('pt-PT', {day: 'numeric', month: 'short'}).replace('.', '') + ' às ' +
      dt.toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'}) + (PROV.size ? ` (J${NGW} provisória)` : '');
  } else t.textContent = '—';
  if (UNKNOWN_PAY.length) {
    console.warn('MANUAL_PAYMENTS: nomes que não são jogadores:', UNKNOWN_PAY);
    $('.home-foot').insertAdjacentHTML('beforeend', `<p class="due-txt">Pagamentos sem jogador: ${UNKNOWN_PAY.join(', ')}</p>`);
  }
}

async function boot(){
  let data;
  try {
    const res = await fetch('data/fpl.json', {cache: 'no-store'});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    buildData(data);
    if (!NGW) throw new Error('ainda não há jornadas');
  } catch (err) {
    console.warn('Não foi possível carregar data/fpl.json:', err);
    $('.app').innerHTML = '<p class="fail-msg">Não foi possível carregar os dados da liga. Tenta outra vez daqui a pouco.</p>';
    return;
  }
  gw = NGW; highlight = order(NGW).slice(0, 3);
  renderFoot(); renderProvBanner(); renderJornada(); renderLiga(); renderStats(); show(); placeLenses(true);
  document.fonts && document.fonts.ready.then(() => placeLenses(true));

  /* App instalável: funciona offline (só em http/https). Com notificações ligadas, é o OneSignal que regista o
     sw.js; um segundo registo com outro URL substituiria o primeiro e desligava o push. */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !ONESIGNAL_APP_ID) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker não registado:', err));
  }
  setupNotifications();

  /* Os telemóveis mantêm a app aberta em segundo plano: ao voltar ao ecrã, recarrega se houver dados mais recentes */
  let lastCheck = Date.now();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !data.updated_at) return;
    if (Date.now() - lastCheck < 5 * 60 * 1000) return;   /* no máximo de 5 em 5 minutos */
    lastCheck = Date.now();
    try {
      const latest = await (await fetch('data/fpl.json', {cache: 'no-store'})).json();
      if (latest.updated_at && latest.updated_at !== data.updated_at) location.reload();
    } catch (_) { /* offline: fica o que já está */ }
  });
}
boot();

</script>
