name: Update FPL data

on:
  schedule:
    # Hourly (UTC), so a finished gameweek shows up (and is announced) soon after FPL finalises it.
    - cron: "17 * * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
    inputs:
      test_notification:
        description: "Only send a test push notification (changes nothing else)"
        type: boolean
        default: false
      preview_gw:
        description: "Only send the real notification for this gameweek number as a preview, marked (teste), e.g. 9 (changes nothing else)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python scripts/notify.py --test

      - name: Send gameweek preview
        if: ${{ inputs.preview_gw && !inputs.test_notification }}
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          PREVIEW_GW: ${{ inputs.preview_gw }}
        run: python scripts/notify.py --gw "$PREVIEW_GW" --send

      - name: Fetch league data
        if: ${{ !inputs.test_notification && !inputs.preview_gw }}
        run: python scripts/fetch_fpl.py

      # A failed notification must never stop the data from being saved
      - name: Gameweek notification
        if: ${{ !inputs.test_notification && !inputs.preview_gw }}
        continue-on-error: true
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python scripts/notify.py

      - name: Commit if changed
        if: ${{ !inputs.test_notification && !inputs.preview_gw }}
        run: |
          # git status (not git diff) so brand-new files in data/ are picked up too
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update FPL data"
          git push
